<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THANOS AI Stock Agent - Frontend Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background: #e8e8e8;
            color: #333;
            margin-right: auto;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #queryInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #queryInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #sendButton:hover:not(:disabled) {
            background: #5568d3;
        }

        #sendButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .agents-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .examples {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .examples h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .example-button {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .example-button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 THANOS AI Stock Agent</h1>
        <p class="subtitle">Ask me anything about stocks, news, or products!</p>
        
        <div class="chat-container" id="chatContainer">
            <div class="bot-message message">
                👋 Welcome! I can help you with:
                <ul style="margin-top: 10px; padding-left: 20px;">
                    <li>Stock prices and market data</li>
                    <li>Financial and general news</li>
                    <li>Product research and prices</li>
                </ul>
                Try asking me something!
            </div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="queryInput" 
                placeholder="Ask me anything... (e.g., 'What's the price of AAPL?')"
                onkeypress="if(event.key === 'Enter') sendQuery()"
            >
            <button id="sendButton" onclick="sendQuery()">Send</button>
        </div>

        <div class="examples">
            <h3>Try these examples:</h3>
            <button class="example-button" onclick="useExample('What is the price of AAPL stock?')">
                📈 Stock Price
            </button>
            <button class="example-button" onclick="useExample('Latest news about Tesla')">
                📰 Financial News
            </button>
            <button class="example-button" onclick="useExample('What is happening in tech news?')">
                🌐 General News
            </button>
            <button class="example-button" onclick="useExample('PS5 Pro price in Pakistan')">
                🛒 Product Research
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/query';
        
        let sessionId = 'session-' + Date.now();

        function useExample(query) {
            document.getElementById('queryInput').value = query;
            sendQuery();
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const button = document.getElementById('sendButton');
            const chatContainer = document.getElementById('chatContainer');
            const query = input.value.trim();

            if (!query) return;

            // Disable input and button
            input.disabled = true;
            button.disabled = true;
            button.innerHTML = '<span class="loading"></span>';

            // Add user message
            addMessage(query, 'user');
            input.value = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Add bot response
                let botMessageHtml = data.response;
                if (data.agents_used && data.agents_used.length > 0) {
                    botMessageHtml += `<div class="agents-info">Agents used: ${data.agents_used.join(', ')}</div>`;
                }
                addMessage(botMessageHtml, 'bot');

            } catch (error) {
                console.error('Error:', error);
                addMessage(`❌ Error: ${error.message}. Make sure the API server is running on ${API_URL}`, 'bot');
            } finally {
                // Re-enable input and button
                input.disabled = false;
                button.disabled = false;
                button.innerHTML = 'Send';
                input.focus();
            }
        }

        function addMessage(text, type) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            if (type === 'bot') {
                // Allow HTML for bot messages (formatted responses)
                messageDiv.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                messageDiv.textContent = text;
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Focus input on load
        document.getElementById('queryInput').focus();
    </script>
</body>
</html>
